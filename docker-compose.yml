# Nombre del proyecto en Docker Compose (agrupa los contenedores en Docker Desktop)
name: atlas-bank

services:
  # Servicio 1: Base de datos relacional PostgreSQL
  postgres:
    # Imagen oficial de Docker Hub a utilizar
    image: postgres:17
    # Nombre exacto que tendrá el contenedor
    container_name: atlas-bank-db
    # Variables de entorno para inicializar la base de datos
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas123
      POSTGRES_DB: atlas_bank
    # Mapeo de puertos: [puerto_en_tu_pc]:[puerto_dentro_del_contenedor]
    ports:
      - "5432:5432"
    # Volumen persistente para que los datos no se borren al apagar el contenedor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Comprobación de salud: asegura que PostgreSQL esté 100% listo para recibir conexiones
    healthcheck:
      # Comando que ejecuta PostgreSQL para verificar si acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_bank"]
      # Cada cuánto tiempo comprueba el estado
      interval: 5s
      # Tiempo máximo de espera por cada intento
      timeout: 5s
      # Número de intentos fallidos antes de marcarlo como no saludable
      retries: 5

  # Servicio 2: API de Spring Boot
  api:
    # Construye la imagen a partir del Dockerfile en la raíz del proyecto
    build: .
    # Nombre exacto que tendrá el contenedor
    container_name: atlas-bank-api
    # Expone el puerto de la API hacia tu máquina local
    ports:
      - "8080:8080"
    # Variables de entorno que sobreescriben la configuración de application.yaml
    environment:
      # URL de conexión apuntando al servicio 'postgres' por la red interna de Docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas_bank
      SPRING_DATASOURCE_USERNAME: atlas
      SPRING_DATASOURCE_PASSWORD: atlas123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # Hibernate: actualiza las tablas automáticamente en PostgreSQL según las entidades Java
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      # Desactiva la consola H2 en este entorno
      SPRING_H2_CONSOLE_ENABLED: "false"
    # Orden de arranque y dependencia
    depends_on:
      postgres:
        # Espera a que el healthcheck de postgres responda OK antes de iniciar la API
        condition: service_healthy

# Definición de volúmenes gestionados por Docker para persistencia de datos
volumes:
  postgres_data:
